<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진로 설계 플랫폼 - 프로필 등록</title>
    <!-- CSS 폴더 안의 style.css 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 사이드바: 메뉴 구성 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>CareerPath</h2>
            </div>
            <nav class="menu">
                <a href="#" class="active">📝 프로필/성적 입력</a>
                <a href="#">📊 진로 분석 리포트</a>
                <a href="#">🎯 추천 학과/직업</a>
            </nav>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header>
                <h1>학생 프로필 및 성적 등록</h1>
                <p>진로 맞춤형 분석을 위해 정확한 정보를 입력해 주세요.</p>
            </header>

            <section class="form-container">
                <form id="careerForm">
                    <!-- 기본 정보 섹션 -->
                    <div class="form-section">
                        <h3>🏫 기본 학적 정보</h3>
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="schoolName">학교명</label>
                                <input type="text" id="schoolName" placeholder="예: 미래고등학교" required>
                            </div>
                            <div class="input-group">
                                <label for="grade">학년</label>
                                <select id="grade" required>
                                    <option value="">선택</option>
                                    <option value="1">1학년</option>
                                    <option value="2">2학년</option>
                                    <option value="3">3학년</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="majorTrack">계열</label>
                                <select id="majorTrack" required>
                                    <option value="">선택</option>
                                    <option value="general">일반(인문/자연)</option>
                                    <option value="special">특성화/예체능</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 성적 정보 섹션 -->
                    <div class="form-section">
                        <h3>📊 주요 과목 내신 등급 (최근 학기)</h3>
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="scoreKorean">국어</label>
                                <input type="number" id="scoreKorean" min="1" max="9" placeholder="1~9등급" required>
                            </div>
                            <div class="input-group">
                                <label for="scoreMath">수학</label>
                                <input type="number" id="scoreMath" min="1" max="9" placeholder="1~9등급" required>
                            </div>
                            <div class="input-group">
                                <label for="scoreEnglish">영어</label>
                                <input type="number" id="scoreEnglish" min="1" max="9" placeholder="1~9등급" required>
                            </div>
                        </div>
                    </div>

                    <!-- 진로 관심사 섹션 -->
                    <div class="form-section">
                        <h3>🎯 희망 진로 분야</h3>
                        <div class="input-group">
                            <label for="interest">가장 관심 있는 분야나 직업을 적어주세요</label>
                            <input type="text" id="interest" placeholder="예: AI 개발자, 마케터, 간호사 등">
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">정보 저장 및 진로 분석하기</button>
                </form>
            </section>
        </main>
    </div>

    <!-- JS 폴더 안의 script.js 연결 -->
    <script src="js/script.js"></script>
</body>
</html>
